# The public site and a same-origin door to the relay API. TLS and the real domain are a later
# step, so this block answers on :8321 by IP and must not touch the :80 default site.
server {
    listen 8321 default_server;
    listen [::]:8321 default_server;
    server_name _;

    root /var/www/slag-site/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Hashed build assets never change under the same name.
    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Same origin means the site can post telemetry without CORS, and the relay keeps its
    # own auth rules: this proxy forwards, it does not authorise.
    location /api/ {
        proxy_pass http://127.0.0.1:8320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 1m;
    }

    # The relay's own liveness endpoint, so uptime checks can point at the public address.
    location = /health {
        proxy_pass http://127.0.0.1:8320/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Astro writes /docs/install/index.html; the trailing `=404` keeps `error_page` in charge of
    # the status, so a missing page is a real 404 and not a 200 with a sad face.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
